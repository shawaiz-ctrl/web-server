name: CI/CD - Test and Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: dummy-app
  HOST_PORT: 80          # port exposed on the EC2 instance
  CONTAINER_PORT: 3000   # port the app listens on inside the container

jobs:
  # test:
  #   name: Run tests
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

  #     - name: Set up Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         cache: npm

  #     - name: Install dependencies
  #       run: npm ci

  #     - name: Run tests
  #       run: npm test

  #     - name: Verify Docker image builds
  #       run: docker build -t ${{ env.APP_NAME }}:ci .

  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy source to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "src,package.json,package-lock.json,Dockerfile,.dockerignore"
          target: /home/${{ secrets.EC2_USER }}/${{ env.APP_NAME }}
          rm: true   # wipe the target dir first so deleted files don't linger

      - name: Build image and run container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_NAME="${{ env.APP_NAME }}"
            TAG="${{ github.sha }}"
            cd "/home/${{ secrets.EC2_USER }}/$APP_NAME"

            echo ">> Building image $APP_NAME:$TAG"
            docker build \
              --build-arg APP_VERSION="$TAG" \
              -t "$APP_NAME:$TAG" \
              -t "$APP_NAME:latest" .

            echo ">> Replacing old container"
            docker stop "$APP_NAME" 2>/dev/null || true
            docker rm "$APP_NAME" 2>/dev/null || true

            docker run -d \
              --name "$APP_NAME" \
              --restart unless-stopped \
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
              "$APP_NAME:$TAG"

            echo ">> Waiting for health check"
            for i in $(seq 1 15); do
              if curl -fsS "http://localhost:${{ env.HOST_PORT }}/health" > /dev/null; then
                echo ">> App is healthy"
                curl -s "http://localhost:${{ env.HOST_PORT }}/"
                echo
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "!! Health check failed"
                docker logs "$APP_NAME" --tail 50
                exit 1
              fi
              sleep 2
            done

            echo ">> Cleaning up old images"
            docker image prune -f