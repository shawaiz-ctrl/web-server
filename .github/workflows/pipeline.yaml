name: CI/CD - Test and Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: dummy-app
  HOST_PORT: 80          # port exposed on the EC2 instance
  CONTAINER_PORT: 3000   # port the app listens on inside the container

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify Docker image builds
        run: docker build -t ${{ env.APP_NAME }}:ci .

  deploy:
    name: Deploy to EC2
    needs: test
    # Deploy only on push to main or manual trigger, never on pull requests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    steps:
      - name: SSH into EC2, clone code, build image, run container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_NAME="${{ env.APP_NAME }}"
            TAG="${{ github.sha }}"
            APP_DIR="$HOME/$APP_NAME"

            # Step 1: Git clone (fresh copy every deploy)
            echo ">> Cloning ${{ github.repository }}"
            rm -rf "$APP_DIR"
            git clone --branch "${{ github.ref_name }}" \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
              "$APP_DIR"
            cd "$APP_DIR"
            git checkout "$TAG"
            # Remove the temporary token from the saved remote URL
            git remote set-url origin "https://github.com/${{ github.repository }}.git"

            # Step 2: Build the Docker image
            echo ">> Building image $APP_NAME:$TAG"
            docker build \
              --build-arg APP_VERSION="$TAG" \
              -t "$APP_NAME:$TAG" \
              -t "$APP_NAME:latest" .

            # Step 3: Run the container (replace the old one)
            echo ">> Starting container"
            docker stop "$APP_NAME" 2>/dev/null || true
            docker rm "$APP_NAME" 2>/dev/null || true
            docker run -d \
              --name "$APP_NAME" \
              --restart unless-stopped \
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
              "$APP_NAME:$TAG"

            # Step 4: Verify it is up
            echo ">> Waiting for health check"
            for i in $(seq 1 15); do
              if curl -fsS "http://localhost:${{ env.HOST_PORT }}/health" > /dev/null; then
                echo ">> App is healthy"
                curl -s "http://localhost:${{ env.HOST_PORT }}/"; echo
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "!! Health check failed"
                docker logs "$APP_NAME" --tail 50
                exit 1
              fi
              sleep 2
            done

            docker image prune -f